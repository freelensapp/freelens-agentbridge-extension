name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: publishing
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm cache path
        id: pnpm-cache
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Validate tag version
        id: version
        run: |
          set -eo pipefail
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

          if [[ "$package_version" == *-* ]]; then
            echo "npm-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack
        run: |
          set -eo pipefail
          mkdir -p dist
          pnpm pack --pack-destination dist
          packages=(dist/*.tgz)

          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected one package tarball, found ${#packages[@]}" >&2
            exit 1
          fi

          echo "PACKAGE_TGZ=${packages[0]}" >> "$GITHUB_ENV"

      - name: Publish package
        run: |
          set -eo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          publish_package() {
            if [[ "$package_version" == *-* ]]; then
              npm_tag=next
            else
              npm_tag=latest
            fi

            pnpm publish -r --no-git-checks --tag "$npm_tag" --provenance
          }

          for attempt in 1 2 3; do
            if publish_package; then
              exit 0
            fi

            published_version="$(npm view "$package_name@$package_version" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [[ "$published_version" == "$package_version" ]]; then
              echo "$package_name@$package_version is already published."
              exit 0
            fi

            if [[ $attempt -lt 3 ]]; then
              sleep "$((attempt * 10))"
            fi
          done

          exit 1

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ env.PACKAGE_TGZ }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.npm-tag == 'next' }}
