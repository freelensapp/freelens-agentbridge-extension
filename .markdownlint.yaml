# Prettier friendly markdownlint config (all formatting rules disabled)
extends: markdownlint/style/prettier
# First line in a file should be a top-level heading
MD041: false
# Allow the <details>/<summary> elements used to collapse provider sections.
MD033:
  allowed_elements:
    - details
    - summary
# Allow bare GitHub user-attachments URLs: GitHub renders them as video
# players, while it strips <video> tags from Markdown.
MD034: false
